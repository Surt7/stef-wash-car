spring.application.name=stef-wash-car

# Charge facultativement le fichier .env local depuis la racine du projet.
# En production, les variables peuvent être fournies directement par l'environnement.
spring.config.import=optional:file:.env[.properties]

# =========================
# PostgreSQL
# =========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/stef_wash_car}
spring.datasource.username=${DB_USERNAME:stef}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
server.error.include-stacktrace=never
server.error.include-message=never


# =========================
# Mail
# =========================
spring.mail.host=${MAIL_HOST:YOUR_SMTP_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:booking@lesphotosdemai.fr}
app.mail.test-to=${MAIL_TEST_TO:}
app.mail.archive-bcc=${MAIL_ARCHIVE_BCC:}

app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.mail.enabled=${MAIL_ENABLED:false}

# =========================
# Administration
# =========================
app.security.admin.username=${ADMIN_USERNAME}
app.security.admin.password=${ADMIN_PASSWORD}

# =========================
# OpenAPI
# =========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}


# =========================
# Microsoft Graph - désactivé
# =========================
# Configuration conservée pour une future réactivation de GraphMailer.
# app.graph.default-from-user=


# =========================
# Google Calendar - optionnel
# =========================
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.refresh-token=${GOOGLE_REFRESH_TOKEN:}
app.google.calendar-id=${GOOGLE_CALENDAR_ID:}
