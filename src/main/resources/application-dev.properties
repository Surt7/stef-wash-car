# Development profile only.
# Your normal datasource settings can stay in application.properties.

spring.jpa.show-sql=false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
app.mail.enabled=${MAIL_ENABLED:false}
app.security.admin.username=${ADMIN_USERNAME:provider.dev@example.test}
app.security.admin.password=${ADMIN_PASSWORD:change-me-in-dev}

# The seeder itself is activated by @Profile("dev").
# Keep ddl-auto=update in application.properties for now if you do not want
# the local database wiped at every restart.
